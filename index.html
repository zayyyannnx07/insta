<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Aesthetic Profile Engine</title>
  <style>
    :root {
      --insta-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --bg-main: #09090b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: #fafafa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* ==================== INPUT FORM PANEL (GLASSMORPHIC) ==================== */
    .form-wrapper {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 32px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }

    .form-header {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .input-box {
      margin-bottom: 16px;
    }

    .input-box label {
      display: block;
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .input-box input, .input-box textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 16px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-box input:focus, .input-box textarea:focus {
      border-color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.08);
    }

    .row-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Premium Custom Drag & Drop box */
    .upload-zone {
      width: 100%;
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      cursor: pointer;
      background: rgba(255,255,255,0.02);
      margin-bottom: 24px;
      transition: all 0.3s;
    }

    .upload-zone:hover {
      border-color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.04);
    }

    .upload-zone svg {
      height: 32px;
      fill: #a1a1aa;
      margin-bottom: 8px;
    }

    .upload-zone p {
      font-size: 12px;
      color: #a1a1aa;
    }

    .status-pill {
      font-size: 11px;
      color: #22c55e;
      margin-top: 6px;
      font-weight: 600;
      display: none;
    }

    #file-input { display: none; }

    /* Clean Trigger Button */
    .btn-trigger {
      width: 100%;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #ffffff;
      color: #000000;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-trigger:hover {
      transform: scale(1.02);
      background: #f4f4f5;
    }


    /* ==================== HIGH-END CARD DISPLAY SYSTEM ==================== */
    .profile-viewport {
      width: 100%;
      height: 100vh;
      position: relative;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .btn-nav-back {
      position: absolute;
      top: 30px;
      left: 30px;
      padding: 10px 18px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: #e4e4e7;
      font-size: 13px;
      font-weight: 500;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .btn-nav-back:hover {
      background: #ffffff;
      color: #000000;
    }

    /* Core Card Layout (Mixed with your provided structural parameters) */
    .master-card-container {
      position: relative;
      width: 350px;
      height: 480px;
      background: linear-gradient(135deg, #010101 0%, #0c0c0e 50%, #010101 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 40px 80px rgba(0,0,0,0.7);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .master-card-container:hover {
      transform: scale(1.03) rotate(-0.5deg);
      border-color: rgba(255,255,255,0.2);
    }

    /* Light sheen sweeps reflection animation overlay */
    .sheen-layer {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
      transform: translateX(-100%) skewX(-12deg);
      transition: transform 0.8s ease;
    }
    
    .master-card-container:hover .sheen-layer {
      transform: translateX(100%) skewX(-12deg);
    }

    /* Profile Frame Section */
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The Instagram Professional Rounding Border Track Animation */
    .avatar-ring-animated {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 2.5px; /* Border gap thickness */
      background: var(--insta-gradient);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: spin-ring 6s linear infinite;
    }

    @keyframes spin-ring {
      100% { transform: rotate(360deg); }
    }

    .avatar-core-img {
      width: calc(100% - 10px);
      height: calc(100% - 10px);
      object-fit: cover;
      border-radius: 50%;
      background: #18181b;
      border: 2px solid #010101;
    }

    /* Information Fields Layout */
    .meta-details-box {
      text-align: center;
      width: 100%;
      margin-top: 16px;
    }

    .meta-name {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 2px;
    }

    .meta-username {
      font-size: 13px;
      font-weight: 500;
      color: #a1a1aa;
      margin-bottom: 12px;
    }

    .meta-bio {
      font-size: 13px;
      color: #d4d4d8;
      line-height: 1.5;
      padding: 0 10px;
    }

    /* Stats Board Configuration */
    .metrics-dashboard {
      display: flex;
      width: 100%;
      justify-content: space-around;
      border-top: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 16px 0;
      margin: 20px 0;
    }

    .metric-node text {
      display: block;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .metric-node span {
      font-size: 11px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
      display: block;
    }

    /* Actions Hub Utility */
    .interaction-hub {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .hub-btn {
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-prime-follow {
      background: #ffffff;
      color: #000000;
    }

    .btn-prime-follow.active-state {
      background: rgba(255,255,255,0.08);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-sec-msg {
      background: rgba(255,255,255,0.05);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .btn-sec-msg:hover {
      background: rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>

  <div class="form-wrapper" id="panel-form">
    <div class="form-header">Create Profile</div>
    
    <div class="input-box">
      <label>Full Name</label>
      <input type="text" id="in-name" placeholder="Aman Sharma" value="Aman Sharma">
    </div>

    <div class="input-box">
      <label>Username</label>
      <input type="text" id="in-user" placeholder="cyber_aman" value="cyber_aman">
    </div>

    <div class="input-box">
      <label>Bio</label>
      <textarea id="in-bio" rows="2" placeholder="Write your profile bio...">Architecting clean minimal UI concepts. Living in 2026. ⚡</textarea>
    </div>

    <div class="row-grid">
      <div class="input-box">
        <label>Followers</label>
        <input type="number" id="in-followers" value="84200">
      </div>
      <div class="input-box">
        <label>Following</label>
        <input type="number" id="in-following" value="312">
      </div>
    </div>

    <label class="upload-zone" for="file-input">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 5h16v14H4zm2 2v10h12V7zm4 2l2.5 3 1.5-1.5L16 14H8z"/>
      </svg>
      <p id="upload-label">Select Profile Picture</p>
      <div class="status-pill" id="status-pill">LocalStorage Synchronized ✓</div>
    </label>
    <input type="file" id="file-input" accept="image/*">

    <button type="button" class="btn-trigger" onclick="compileAndBuildProfile()">
      { See Your Profile }
    </button>
  </div>


  <div class="profile-viewport" id="panel-view">
    
    <button class="btn-nav-back" onclick="rollbackToForm()">← Edit Parameters</button>

    <div class="master-card-container">
      <div class="sheen-layer"></div>

      <div class="avatar-wrapper">
        <div class="avatar-ring-animated"></div>
        <img src="" id="out-avatar" class="avatar-core-img" alt="Avatar Target">
      </div>

      <div class="meta-details-box">
        <div class="meta-name" id="out-name">Aman Sharma</div>
        <div class="meta-username" id="out-user">@cyber_aman</div>
        <div class="meta-bio" id="out-bio">Architecting clean minimal UI concepts. Living in 2026. ⚡</div>
      </div>

      <div class="metrics-dashboard">
        <div class="metric-node">
          <text>0</text>
          <span>Posts</span>
        </div>
        <div class="metric-node">
          <text id="out-followers">0</text>
          <span>Followers</span>
        </div>
        <div class="metric-node">
          <text id="out-following">0</text>
          <span>Following</span>
        </div>
      </div>

      <div class="interaction-hub">
        <button class="hub-btn btn-prime-follow" id="follow-trigger" onclick="executeFollowToggle()">Follow</button>
        <button class="hub-btn btn-sec-msg" onclick="executeMessageDialog()">Message</button>
      </div>

    </div>
  </div>

  <script>
    let activeBase64String = "";
    let followerNumericValue = 0;
    let localTrackingFollowState = false;

    // Vector Graphics Fallback Avatar
    const defaultPlaceholderImage = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150' viewBox='0 0 100 100'><rect width='100%25' height='100%25' fill='%231c1c1e'/><circle cx='50' cy='45' r='20' fill='%233a3a3c'/><path d='M20 85 C20 65, 80 65, 80 85' fill='%233a3a3c'/></svg>";

    // Auto load state from local storage stream
    window.addEventListener('DOMContentLoaded', () => {
      const persistedImage = localStorage.getItem('user_profile_dp');
      if (persistedImage) {
        activeBase64String = persistedImage;
        document.getElementById('upload-label').innerText = "Cached DP Active";
        document.getElementById('status-pill').style.display = "block";
      }
    });

    // High fidelity Image downsampling workflow routine (Canvas Compression)
    document.getElementById('file-input').addEventListener('change', function(event) {
      const selectedFile = event.target.files[0];
      if (selectedFile) {
        const fileStreamReader = new FileReader();
        fileStreamReader.onload = function(e) {
          const imageInstance = new Image();
          imageInstance.src = e.target.result;
          imageInstance.onload = function() {
            const memoryCanvas = document.createElement('canvas');
            const BOUNDING_LIMIT = 350; 
            const dynamicScale = BOUNDING_LIMIT / imageInstance.width;
            
            memoryCanvas.width = BOUNDING_LIMIT;
            memoryCanvas.height = imageInstance.height * dynamicScale;

            const graphicsContext = memoryCanvas.getContext('2d');
            graphicsContext.drawImage(imageInstance, 0, 0, memoryCanvas.width, memoryCanvas.height);

            activeBase64String = memoryCanvas.toDataURL('image/jpeg', 0.75);
            
            try {
              localStorage.setItem('user_profile_dp', activeBase64String);
              document.getElementById('upload-label').innerText = "Image Linked!";
              document.getElementById('status-pill').style.display = "block";
            } catch (storageError) {
              console.warn("Storage quota exception, bypass cache layer.");
            }
          };
        };
        fileStreamReader.readAsDataURL(selectedFile);
      }
    });

    // Compilation controller engine
    function compileAndBuildProfile() {
      const inputName = document.getElementById('in-name').value || "Identity Undefined";
      const inputUser = document.getElementById('in-user').value || "anonymous";
      const inputBio = document.getElementById('in-bio').value || "";
      const inputFollowers = parseInt(document.getElementById('in-followers').value) || 0;
      const inputFollowing = document.getElementById('in-following').value || 0;

      // Map data straight into DOM node layers
      document.getElementById('out-name').innerText = inputName;
      document.getElementById('out-user').innerText = `@${inputUser.replace('@', '')}`;
      document.getElementById('out-bio').innerText = inputBio;
      
      // Initialize internal numerical follower models
      followerNumericValue = inputFollowers;
      localTrackingFollowState = false;
      refreshVisualCounters(followerNumericValue);

      document.getElementById('out-following').innerText = shortenMetricNotation(inputFollowing);

      // Bind profile image payload
      document.getElementById('out-avatar').src = activeBase64String ? activeBase64String : defaultPlaceholderImage;

      // View state switching
      document.getElementById('panel-form').style.display = 'none';
      document.getElementById('panel-view').style.display = 'flex';
    }

    function rollbackToForm() {
      document.getElementById('panel-view').style.display = 'none';
      document.getElementById('panel-form').style.display = 'block';
    }

    // High performance UI metrics data shortening filters
    function shortenMetricNotation(value) {
      value = parseInt(value);
      if (isNaN(value)) return '0';
      if (value >= 1000000) return (value / 1000000).toFixed(1).replace('.0', '') + 'M';
      if (value >= 1000) return (value / 1000).toFixed(1).replace('.0', '') + 'K';
      return value;
    }

    function refreshVisualCounters(totalValue) {
      document.getElementById('out-followers').innerText = shortenMetricNotation(totalValue);
    }

    // Interaction Business Rules Engine: Follow Mechanism
    function executeFollowToggle() {
      const followBtnReference = document.getElementById('follow-trigger');
      if (!localTrackingFollowState) {
        followerNumericValue++;
        localTrackingFollowState = true;
        followBtnReference.innerText = "Following";
        followBtnReference.classList.add('active-state');
      } else {
        followerNumericValue--;
        localTrackingFollowState = false;
        followBtnReference.innerText = "Follow";
        followBtnReference.classList.remove('active-state');
      }
      refreshVisualCounters(followerNumericValue);
    }

    // Interaction Business Rules Engine: Alerts Messaging dialog fallback
    function executeMessageDialog() {
      alert("[ User is currently busy... ]");
    }
  </script>
</body>
</html>
